<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORI Explorer</title>
<style>
:root{
  --accent:#0C6CF2; --accent-dark:#0C6CF2; --accent-light:#EFF6FF; --accent-lighter:#F8FAFC;
  --bg:#F8FAFC; --panel:#FFFFFF; --border:#E2E8F0; --text:#0F172A; --muted:#64748B;
  --link:#0C6CF2; --green:#10B981; --red:#EF4444; --pending:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.right{text-align:right}
header{background:linear-gradient(135deg,#2E7D32,#66BB6A);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo b{color:#DCEDC8}
nav{display:flex;gap:4px}
nav a{color:#E8F5E9;padding:6px 12px;border-radius:6px;font-weight:600;text-decoration:none}
nav a:hover{background:rgba(255,255,255,.15)}
nav a.active{background:rgba(255,255,255,.25)}
#qwrap{margin-left:auto;display:flex;gap:8px;align-items:center}
#q{width:280px;padding:8px 12px;border:none;border-radius:8px;font-size:13px;outline:none}
#banner{display:none;background:#FDECEA;color:#C62828;padding:10px 20px;border-bottom:1px solid #F5C6CB;font-weight:600}
main{padding:20px;max-width:1100px;margin:0 auto}
h2{font-size:15px;margin:22px 0 10px;color:var(--accent-dark)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.card .v{font-size:22px;font-weight:700;margin:4px 0;color:var(--accent-dark)}
.card .s{font-size:11px;color:var(--muted);word-break:break-all}
.bar{height:6px;background:var(--accent-lighter);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
th{background:var(--accent-light);color:var(--accent-dark);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px}
td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--accent-lighter)}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted)}
.chip b{color:var(--accent-dark)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-yes{background:var(--accent-light);color:var(--accent-dark)}
.badge-no{background:#EEEEEE;color:var(--muted)}
.badge-green{background:var(--accent-light);color:var(--accent-dark)}
.badge-red{background:#FDECEA;color:var(--red)}
.badge-pending{background:#FFF8E1;color:var(--pending)}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.detail .row{display:flex;padding:9px 14px;border-top:1px solid var(--border)}
.detail .row:first-child{border-top:none}
.detail .k{width:150px;min-width:150px;color:var(--muted);font-size:12px}
.detail .v{flex:1;word-break:break-all}
.raw{background:#0B1F0A;color:#A5D6A7;padding:12px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:11px;word-break:break-all;white-space:pre-wrap;margin-top:10px}
.pager{display:flex;justify-content:space-between;margin-top:14px}
.pager button{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.pager button:disabled{background:#BDBDBD;cursor:default}
.pager span{color:var(--muted);align-self:center;font-size:12px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}
footer a{color:var(--accent-dark)}
.hl{background:#FFF9C4}
@media(max-width:700px){#q{width:150px}.detail .k{width:110px;min-width:110px}}
</style>
</head>
<body>
<header>
  <div class="logo">ORI <b>&#9671; Explorer</b></div>
  <nav id="nav">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/blocks" data-nav="blocks">Blocks</a>
    <a href="#/mempool" data-nav="mempool">Mempool</a>
  </nav>
  <div id="qwrap">
    <input id="q" type="text" placeholder="Search block height, hash, txid, or address" autocomplete="off">
  </div>
</header>
<div id="banner"></div>
<main id="sub"></main>
<footer>ORI Explorer &mdash; served by your ORI node. API docs at <a href="/docs" target="_blank">/docs</a></footer>
<script>
"use strict";
const API = new URLSearchParams(location.search).get("node") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COIN = 100000000;
const state = {tip:-1, reward:4628000000, halving:2102400, timer:null};

const targetFromBits = bits => {
  const exponent = (bits >>> 24) & 0xFF;
  const mantissa = bits & 0x007FFFFF;
  return exponent <= 3 ? mantissa / Math.pow(2, 8 * (3 - exponent))
                       : mantissa * Math.pow(2, 8 * (exponent - 3));
};
const MAX_TARGET = 0x0000FFFF * Math.pow(2, 208);
const diffFromBits = bits => {
  try { return MAX_TARGET / targetFromBits(bits); } catch (e) { return NaN; }
};
const fmtOri = sats => {
  const v = Number(sats) / COIN;
  return v.toLocaleString("en-US", {maximumFractionDigits: 8}) + " ORI";
};
const fmtShortOri = sats => {
  const v = Number(sats) / COIN;
  return v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1e3 ? (v/1e3).toFixed(1)+"k" : v.toFixed(2);
};
const shortHash = h => h ? h.slice(0,12) + "…" + h.slice(-8) : "?";
const age = ts => {
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
};
const fmtTime = ts => new Date(ts * 1000).toLocaleString("en-GB");
const rewardAt = h => Math.floor((state.reward || 4628000000) / Math.pow(2, Math.min(63, Math.floor(h / (state.halving || 2102400)))));

async function api(path){
  const r = await fetch(API + path, {headers:{"Accept":"application/json"}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function fail(e){
  $("#banner").style.display = "block";
  $("#banner").textContent = "Cannot reach node API: " + e.message + (API ? "" : " (served from the node itself — check your HTTPS domain)");
}
function navActive(){
  const cur = location.hash.split("?")[0] || "#/";
  document.querySelectorAll("#nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.nav === cur.slice(2)));
}
function scheduleAuto(fn, ms){
  if (state.timer) clearTimeout(state.timer);
  state.timer = setTimeout(() => { state.timer = null; fn(); }, ms);
}

/* ── Home ─────────────────────────────────────────────── */
async function loadHome(){
  const info = await api("/info/");
  state.tip = info.height;
  state.reward = info.block_reward_sats;
  state.halving = info.halving_interval;
  const [supply, list] = await Promise.all([
    api("/supply/"),
    api("/blockchain/?start=" + Math.max(0, info.height - 9) + "&limit=10")
  ]);
  const rows = (list.chain || []).slice().sort((a,b) => b.height - a.height);
  const supplyPct = Math.min(100, supply.circulating_sats / supply.max_supply_sats * 100);
  $("#sub").innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Height</div><div class="v">${info.height.toLocaleString()}</div><div class="s">best ${shortHash(info.best_hash)}</div></div>
      <div class="card"><div class="k">Difficulty</div><div class="v">${(+info.difficulty).toFixed(2)}</div><div class="s">total work ${fmtShortWork(info.total_work)}</div></div>
      <div class="card"><div class="k">Circulating</div><div class="v">${fmtShortOri(supply.circulating_sats)}</div><div class="s">of ${fmtShortOri(supply.max_supply_sats)} max</div><div class="bar"><i style="width:${supplyPct}%"></i></div></div>
      <div class="card"><div class="k">Block reward</div><div class="v">${fmtOri(supply.current_block_reward_sats)}</div><div class="s">halving in ${supply.blocks_until_halving.toLocaleString()} blocks</div></div>
      <div class="card"><div class="k">Mempool</div><div class="v">${info.mempool_txs.toLocaleString()}</div><div class="s">pending txs</div></div>
      <div class="card"><div class="k">Peers</div><div class="v">${info.peers}</div><div class="s">connected nodes</div></div>
      <div class="card"><div class="k">Block time</div><div class="v">${info.block_time_seconds}s</div><div class="s">avg last blocks</div></div>
    </div>
    <h2>Latest blocks</h2>
    <table>
      <tr><th>Height</th><th>Age</th><th>Time</th><th class="right">Txs</th><th class="right">Size</th><th class="right">Difficulty</th><th class="right">Miner reward</th></tr>
      ${rows.map(b => `<tr><td><a href="#/block/${b.height}">${b.height}</a></td><td class="muted">${age(b.timestamp)}</td><td class="muted">${fmtTime(b.timestamp)}</td><td class="right">${b.tx_count}</td><td class="right muted">${b.size} B</td><td class="right">${(isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits)).toFixed(2)}</td><td class="right mono">${fmtOri(rewardAt(b.height))}</td></tr>`).join("")}
    </table>
    <div class="pager"><span></span><button onclick="location.hash='#/blocks'">View all blocks &rarr;</button></div>`;
  scheduleAuto(loadHome, 5000);
}
function fmtShortWork(w){
  const n = Number(BigInt(w || 0));
  if (n >= 1e15) return (n/1e15).toFixed(1)+"P";
  if (n >= 1e12) return (n/1e12).toFixed(1)+"T";
  return n.toLocaleString();
}

/* ── Blocks (blockchain.com style) ───────────────────── */
async function loadBlocks(start){
  const parsed = Math.max(0, +start || 0);
  const info = await api("/info/");
  let s = parsed;
  if (!start && !location.hash.includes("start=")) s = Math.max(0, info.height - 24);
  s = Math.min(s, Math.max(0, info.height - 24));
  const d = await api("/blockchain/?start=" + s + "&limit=25");
  const rows = (d.chain || []).slice().sort((a,b) => b.height - a.height);
  const newest = s + 25 >= d.tip;
  $("#sub").innerHTML = `
    <h2>Blocks <span class="muted" style="text-transform:none;font-weight:400">(${d.tip.toLocaleString()} total)</span></h2>
    <table>
      <tr><th>Height</th><th>Age</th><th>Time</th><th class="right">Transactions</th><th class="right">Size</th><th class="right">Difficulty</th><th class="right">Miner reward</th></tr>
      ${rows.map(b => `<tr><td><a href="#/block/${b.height}">${b.height}</a></td><td class="muted">${age(b.timestamp)}</td><td class="muted">${fmtTime(b.timestamp)}</td><td class="right"><a href="#/block/${b.height}">${b.tx_count}</a></td><td class="right muted">${b.size} B</td><td class="right">${(isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits)).toFixed(2)}</td><td class="right mono">${fmtOri(rewardAt(b.height))}</td></tr>`).join("")}
    </table>
    <div class="pager">
      <button ${newest ? "disabled" : ""} onclick="location.hash='#/blocks?start=${s+25}'">&larr; Newer</button>
      <span>${s} &ndash; ${Math.min(d.tip, s + 24)} of ${d.tip}</span>
      <button ${s === 0 ? "disabled" : ""} onclick="location.hash='#/blocks?start=${Math.max(0, s-25)}'">Older &rarr;</button>
    </div>`;
}

/* ── Block detail ────────────────────────────────────── */
async function loadBlock(height){
  const [b, txsData] = await Promise.all([
    api("/block/" + height),
    api("/block/" + height + "/txs")
  ]);
  const diff = isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits);
  const txs = txsData.txs || [];
  $("#sub").innerHTML = `
    <h2>Block #${b.height}</h2>
    <div class="detail">
      <div class="row"><div class="k">Height</div><div class="v">${b.height}</div></div>
      <div class="row"><div class="k">Hash</div><div class="v mono">${b.hash}</div></div>
      <div class="row"><div class="k">Previous hash</div><div class="v mono">${b.height > 0 ? `<a href="#/block/${b.height-1}">${b.prev_hash}</a>` : b.prev_hash}</div></div>
      <div class="row"><div class="k">Merkle root</div><div class="v mono">${b.merkle_root}</div></div>
      <div class="row"><div class="k">Timestamp</div><div class="v">${fmtTime(b.timestamp)} UTC (${age(b.timestamp)})</div></div>
      <div class="row"><div class="k">Difficulty</div><div class="v">${isFinite(diff) ? diff.toFixed(2) : "n/a"}</div></div>
      <div class="row"><div class="k">Bits / Nonce</div><div class="v mono">0x${b.bits.toString(16)} / ${b.nonce}</div></div>
      <div class="row"><div class="k">Version</div><div class="v">0x${b.version.toString(16)}</div></div>
      <div class="row"><div class="k">Size</div><div class="v">${b.size} bytes</div></div>
      <div class="row"><div class="k">Miner reward</div><div class="v mono">${fmtOri(rewardAt(b.height))}</div></div>
      <div class="row"><div class="k">Transactions</div><div class="v">${b.tx_count}</div></div>
    </div>
    <h2>Transactions</h2>
    <table>
      <tr><th>Txid</th><th class="right">Output value</th></tr>
      ${txs.map((t, i) => `<tr><td class="mono"><a href="#/tx/${t.txid}">${i === 0 ? "&#9671; coinbase" : shortHash(t.txid)}</a></td><td class="right mono">${fmtOri(t.output_value)}</td></tr>`).join("")}
    </table>`;
}

/* ── Transaction detail ──────────────────────────────── */
async function loadTx(txid){
  const d = await api("/tx/" + txid);
  const ins = d.inputs || [], outs = d.outputs || [];
  const confirmed = !d.mempool;
  const inValue = ins.reduce((a,i) => a + (+(i.value || 0)), 0);
  const outValue = outs.reduce((a,o) => a + (+(o.value || 0)), 0);
  const fee = d.fee_sats != null ? d.fee_sats : Math.max(0, inValue - outValue);
  const conf = d.confirmations ?? (confirmed ? 1 : 0);
  $("#sub").innerHTML = `
    <h2>Transaction</h2>
    <div class="detail">
      <div class="row"><div class="k">Txid</div><div class="v mono">${d.txid}</div></div>
      <div class="row"><div class="k">Status</div><div class="v">${confirmed ? '<span class="badge badge-green">Confirmed</span>' : '<span class="badge badge-pending">Pending (mempool)</span>'} <span class="muted">${conf} confirmation${conf === 1 ? "" : "s"}</span></div></div>
      <div class="row"><div class="k">Block</div><div class="v">${confirmed && d.block && d.block.height != null ? `<a href="#/block/${d.block.height}">#${d.block.height}</a> <span class="muted mono">(${shortHash(d.block.hash)})</span>` : "not mined yet"}</div></div>
      <div class="row"><div class="k">Timestamp</div><div class="v">${d.timestamp ? fmtTime(d.timestamp) : "&ndash;"}</div></div>
      <div class="row"><div class="k">Size</div><div class="v">${d.size} bytes</div></div>
      <div class="row"><div class="k">Fee</div><div class="v">${fee ? fmtOri(fee) : "&ndash;"}${d.fee_rate_sats ? ` <span class="muted">(${d.fee_rate_sats} sats/vB)</span>` : ""}</div></div>
      <div class="row"><div class="k">Version / Locktime</div><div class="v mono">${d.version} / ${d.locktime}</div></div>
      <div class="row"><div class="k">Inputs (${ins.length})</div><div class="v">
        ${ins.length === 0 ? '<span class="muted">coinbase (new coins)</span>' : ins.map(i => `
          <div style="padding:3px 0"><span class="mono">${i.coinbase ? "&#9671;" : ""}<a href="#/tx/${i.prev_txid}">${shortHash(i.prev_txid)}</a>:${i.prev_vout}</span> <span class="muted mono">${i.value != null ? "&middot; " + fmtOri(i.value) : ""}</span></div>`).join("")}
      </div></div>
      <div class="row"><div class="k">Outputs (${outs.length})</div><div class="v">
        ${outs.map((o, i) => `<div style="padding:3px 0"><span class="mono">${o.address ? '<a href="#/address/' + o.address + '">' + esc(o.address) + '</a>' : esc(o.script_pubkey)}</span> <span class="right mono" style="float:right">${fmtOri(o.value)}</span></div>`).join("")}
      </div></div>
    </div>
    <h2>Raw transaction</h2>
    <div class="raw">${esc(d.raw_hex || d.hex || "")}</div>`;
}

/* ── Address ─────────────────────────────────────────── */
async function loadAddress(addr){
  const d = await api("/address/" + addr);
  const u = d.utxos || [];
  const mature = u.filter(x => x.mature);
  const immature = u.filter(x => !x.mature);
  const bal = mature.reduce((a,x) => a + x.value, 0);
  const imm = immature.reduce((a,x) => a + x.value, 0);
  const txids = [...new Set(u.map(x => x.txid).filter(Boolean))];
  $("#sub").innerHTML = `
    <h2>Address</h2>
    <div class="detail">
      <div class="row"><div class="k">Address</div><div class="v mono">${esc(addr)}</div></div>
      <div class="row"><div class="k">Balance</div><div class="v mono"><b>${fmtOri(bal)}</b></div></div>
      <div class="row"><div class="k">Immature</div><div class="v mono">${fmtOri(imm)}</div></div>
      <div class="row"><div class="k">UTXOs</div><div class="v">${u.length} (${immature.length} immature)</div></div>
      <div class="row"><div class="k">Transactions</div><div class="v">${txids.length}</div></div>
    </div>
    <h2>UTXOs</h2>
    <table>
      <tr><th>Txid</th><th class="right">Vout</th><th class="right">Value</th><th>Status</th></tr>
      ${u.map(x => `<tr><td class="mono"><a href="#/tx/${x.txid}">${shortHash(x.txid)}</a></td><td class="right mono">${x.vout}</td><td class="right mono">${fmtOri(x.value)}</td><td>${x.mature ? '<span class="badge badge-green">spendable</span>' : '<span class="badge badge-pending">immature</span>'}</td></tr>`).join("")}
    </table>`;
}

/* ── Mempool (blockchain.com style) ──────────────────── */
async function loadMempool(){
  const [info, mp] = await Promise.all([api("/info/"), api("/mempool/")]);
  const txs = mp.txs || [];
  const totalBytes = txs.reduce((a,t) => a + t.size, 0);
  const totalFee = txs.reduce((a,t) => a + t.fee, 0);
  const avgRate = totalBytes ? (totalFee / totalBytes) : 0;
  $("#sub").innerHTML = `
    <h2>Mempool <span class="muted" style="text-transform:none;font-weight:400">transactions waiting to be confirmed</span></h2>
    <div class="chips">
      <span class="chip">Transactions <b>${mp.count}</b></span>
      <span class="chip">Size <b>${(totalBytes/1024).toFixed(1)} KB</b></span>
      <span class="chip">Total fees <b>${fmtOri(totalFee)}</b></span>
      <span class="chip">Avg fee rate <b>${avgRate.toFixed(2)} sats/vB</b></span>
      <span class="chip">Next block <b>${info.block_time_seconds}s</b></span>
    </div>
    ${txs.length === 0 ? '<p class="muted">Mempool is empty.</p>' : `
    <table>
      <tr><th>Transaction Hash</th><th class="right">Value</th><th class="right">Fee</th><th class="right">Fee Rate</th><th class="right">Size</th><th>RBF</th></tr>
      ${txs.map(t => {
        const val = (t.outputs || []).reduce((a,o) => a + o.value, 0);
        return `<tr><td class="mono"><a href="#/tx/${t.txid}">${shortHash(t.txid)}</a></td>
          <td class="right mono">${fmtOri(val)}</td>
          <td class="right mono">${fmtOri(t.fee)}</td>
          <td class="right mono">${t.fee_rate.toFixed(2)} sats/vB</td>
          <td class="right muted">${t.size} B</td>
          <td>${t.rbf ? '<span class="badge badge-yes">RBF</span>' : '<span class="badge badge-no">no</span>'}</td></tr>`;
      }).join("")}
    </table>`}`;
  scheduleAuto(loadMempool, 5000);
}

/* ── Router ──────────────────────────────────────────── */
async function router(){
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  navActive();
  const [route, qs] = (location.hash || "#/").slice(1).split("?");
  const params = new URLSearchParams(qs || "");
  try {
    if (route === "" || route === "/") return loadHome();
    const parts = route.split("/").filter(Boolean);
    if (parts[0] === "blocks") return loadBlocks(params.get("start"));
    if (parts[0] === "block") return loadBlock(parts[1]);
    if (parts[0] === "tx") return loadTx(parts[1]);
    if (parts[0] === "address") return loadAddress(parts[1]);
    if (parts[0] === "mempool") return loadMempool();
    $("#sub").innerHTML = "<h2>Not found</h2><p class='muted'>Unknown page.</p>";
  } catch (e) {
    fail(e);
  }
}

async function doSearch(){
  const q = $("#q").value.trim();
  if (!q) return;
  const params = new URLSearchParams(location.search);
  const base = API || "";
  try {
    const info = await api("/info/");
    if (/^[0-9]+$/.test(q) && +q >= 0 && +q <= info.height) return location.hash = "#/block/" + q;
    if (/^(ori1[a-z0-9]{20,})$/.test(q)) return location.hash = "#/address/" + q;
    if (/^[0-9a-f]{64}$/i.test(q)) {
      try {
        const r = await fetch(base + "/tx/" + q, {headers:{"Accept":"application/json"}});
        if (r.ok) return location.hash = "#/tx/" + q;
      } catch (e) {}
      try {
        const r = await fetch(base + "/block/hash/" + q, {headers:{"Accept":"application/json"}});
        const b = await r.json();
        if (r.ok && b.height != null) return location.hash = "#/block/" + b.height;
      } catch (e2) {}
    }
    $("#banner").style.display = "block";
    $("#banner").textContent = "No match for: " + q;
    setTimeout(() => $("#banner").style.display = "none", 4000);
  } catch (e) {
    fail(e);
  }
}

$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
addEventListener("hashchange", router);
router();
</script>
