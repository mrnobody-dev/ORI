<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORI Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #10B981; --accent-dark: #059669; --accent-light: rgba(16, 185, 129, 0.15); --accent-lighter: rgba(16, 185, 129, 0.05);
  --bg: #F8FAFC; --panel: rgba(255, 255, 255, 0.85); --border: rgba(148, 163, 184, 0.2); 
  --text: #0F172A; --muted: #64748B;
  --link: #059669; --green: #059669; --red: #E11D48; --pending: #D97706;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  --header-text: #F8FAFC;
}
body.dark {
  --accent: #34D399; --accent-dark: #10B981; --accent-light: rgba(52, 211, 153, 0.15); --accent-lighter: rgba(52, 211, 153, 0.05);
  --bg: #0B0F19; --panel: rgba(17, 24, 39, 0.7); --border: rgba(51, 65, 85, 0.5); 
  --text: #F8FAFC; --muted: #94A3B8;
  --link: #34D399; --green: #10B981; --red: #FB7185; --pending: #FBBF24;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  --header-bg: linear-gradient(135deg, #020617 0%, #0f172a 100%);
  --header-text: #F8FAFC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Outfit', -apple-system, sans-serif; 
  background: var(--bg); color: var(--text); font-size: 14.5px;
  min-height: 100vh; display: flex; flex-direction: column;
  transition: background 0.3s ease, color 0.3s ease;
}
a { color: var(--link); text-decoration: none; transition: color 0.2s, opacity 0.2s; }
a:hover { opacity: 0.8; text-decoration: underline; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: -0.3px; }
.muted { color: var(--muted); font-weight: 400; }
.right { text-align: right; }

header { 
  background: var(--header-bg); color: var(--header-text); 
  padding: 16px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; 
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.logo { font-weight: 800; font-size: 22px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.logo b { color: var(--accent); font-weight: 300; }
.logo span { background: var(--accent); color: #000; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transform: translateY(-2px); }

nav { display: flex; gap: 8px; }
nav a { 
  color: var(--muted); padding: 8px 16px; border-radius: 8px; font-weight: 600; text-decoration: none;
  transition: all 0.2s ease;
}
nav a:hover { background: rgba(255,255,255,0.05); color: #fff; }
nav a.active { background: var(--accent-light); color: var(--accent); }

#qwrap { margin-left: auto; display: flex; gap: 12px; align-items: center; }
#q { 
  width: 320px; padding: 10px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
  font-size: 14px; outline: none; background: rgba(0,0,0,0.2); color: #fff;
  font-family: 'Outfit', sans-serif; transition: all 0.3s;
}
#q:focus { background: rgba(0,0,0,0.4); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
#q::placeholder { color: rgba(255,255,255,0.4); }

#banner { display: none; background: rgba(225, 29, 72, 0.1); color: var(--red); padding: 12px 20px; border-left: 4px solid var(--red); font-weight: 600; margin: 20px auto; max-width: 1200px; border-radius: 0 8px 8px 0; backdrop-filter: blur(8px); }

main { padding: 32px 24px; max-width: 1200px; margin: 0 auto; flex: 1; width: 100%; }

h2 { font-size: 18px; font-weight: 700; margin: 32px 0 16px; color: var(--text); display: flex; align-items: center; gap: 12px; }
h2::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
.card { 
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; 
  box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(16, 185, 129, 0.15); border-color: var(--accent-light); }
.card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
.card .v { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.5px; }
.card .s { font-size: 13px; color: var(--muted); margin-top: 6px; }

.bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); border-radius: 3px; }

table { 
  width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); 
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); 
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
th { background: rgba(0,0,0,0.02); color: var(--muted); text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
body.dark th { background: rgba(255,255,255,0.02); }
td { padding: 14px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; transition: background 0.2s; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--accent-lighter); }

.chips { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.chip { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--muted); backdrop-filter: blur(8px); box-shadow: var(--shadow); }
.chip b { color: var(--text); font-weight: 700; margin-left: 4px; }

.badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.badge-yes, .badge-green { background: var(--accent-light); color: var(--accent-dark); border: 1px solid rgba(16, 185, 129, 0.2); }
.badge-no { background: var(--border); color: var(--muted); }
.badge-red { background: rgba(225, 29, 72, 0.15); color: var(--red); border: 1px solid rgba(225, 29, 72, 0.2); }
.badge-pending { background: rgba(217, 119, 6, 0.15); color: var(--pending); border: 1px solid rgba(217, 119, 6, 0.2); }

.detail { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.detail .row { display: flex; padding: 14px 20px; border-bottom: 1px solid var(--border); transition: background 0.2s; }
.detail .row:last-child { border-bottom: none; }
.detail .row:hover { background: rgba(0,0,0,0.01); }
body.dark .detail .row:hover { background: rgba(255,255,255,0.01); }
.detail .k { width: 180px; min-width: 180px; color: var(--muted); font-weight: 500; display: flex; align-items: center; }
.detail .v { flex: 1; word-break: break-all; font-weight: 500; }

.message-box { 
  background: var(--accent-lighter); border-left: 3px solid var(--accent); 
  padding: 10px 16px; border-radius: 4px 8px 8px 4px; 
  font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text);
  white-space: pre-wrap; line-height: 1.5;
}

.raw { 
  background: #0F172A; color: #34D399; padding: 20px; border-radius: 12px; 
  font-family: 'JetBrains Mono', monospace; font-size: 12px; word-break: break-all; white-space: pre-wrap; margin-top: 16px;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); line-height: 1.6; border: 1px solid #1E293B;
}

.pager { display: flex; justify-content: space-between; margin-top: 24px; align-items: center; }
.pager button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); font-family: 'Outfit', sans-serif; }
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.pager button:disabled { opacity: 0.5; cursor: not-allowed; }
.pager span { color: var(--muted); font-size: 13px; font-weight: 500; }

footer { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; border-top: 1px solid var(--border); margin-top: auto; }
footer a { color: var(--accent); font-weight: 600; }

.tx-in { color: var(--green); }
.tx-out { color: var(--red); }
.tx-pending { color: var(--pending); }

.theme-btn { 
  background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); 
  border-radius: 10px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  font-family: 'Outfit', sans-serif; display: flex; align-items: center; gap: 8px;
}
.theme-btn:hover { background: rgba(255,255,255,0.2); }

.more-btn { background: var(--accent-lighter); color: var(--accent); border: 1px solid var(--accent-light); border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Outfit', sans-serif; font-size: 12px; margin-top: 8px; }
.more-btn:hover { background: var(--accent-light); }

@media(max-width: 768px) {
  header { padding: 16px; gap: 16px; }
  #qwrap { width: 100%; }
  #q { width: 100%; }
  .detail .row { flex-direction: column; gap: 6px; }
  .detail .k { width: 100%; min-width: auto; }
}
</style>
</head>
<body>
<header>
  <a href="#/" class="logo" style="text-decoration:none; color:inherit;">ORI <b>&#9671; Explorer</b></a>
  <nav id="nav">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/blocks" data-nav="blocks">Blocks</a>
    <a href="#/mempool" data-nav="mempool">Mempool</a>
  </nav>
  <div id="qwrap">
    <button id="theme" class="theme-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <span>Dark</span>
    </button>
    <input id="q" type="text" placeholder="Search block height, hash, txid, or address..." autocomplete="off">
  </div>
</header>
<div id="banner"></div>
<main id="sub"></main>
<footer>ORI Network Explorer &mdash; Built on Python. API available at <a href="/docs" target="_blank">/docs</a></footer>
<script>
"use strict";
const API = new URLSearchParams(location.search).get("node") || "";
const $ = s => document.querySelector(s);
const savedTheme = localStorage.getItem("oriExplorerTheme") || "dark";
document.body.classList.toggle("dark", savedTheme === "dark");
window.addEventListener("DOMContentLoaded", () => {
  const btn = $("#theme");
  if (btn) {
    btn.querySelector("span").textContent = document.body.classList.contains("dark") ? "Light" : "Dark";
    btn.onclick = () => {
      const dark = !document.body.classList.contains("dark");
      document.body.classList.toggle("dark", dark);
      localStorage.setItem("oriExplorerTheme", dark ? "dark" : "light");
      btn.querySelector("span").textContent = dark ? "Light" : "Dark";
    };
  }
});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COIN = 100000000;
const state = {tip:-1, reward:null, halving:null, timer:null};

const targetFromBits = bits => {
  const exponent = (bits >>> 24) & 0xFF;
  const mantissa = bits & 0x007FFFFF;
  return exponent <= 3 ? mantissa / Math.pow(2, 8 * (3 - exponent))
                       : mantissa * Math.pow(2, 8 * (exponent - 3));
};
const MAX_TARGET = 0x0000FFFF * Math.pow(2, 208);
const diffFromBits = bits => {
  try { return MAX_TARGET / targetFromBits(bits); } catch (e) { return NaN; }
};
const fmtOri = sats => {
  const v = Number(sats) / COIN;
  return v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 8}) + " ORI";
};
const fmtShortOri = sats => {
  const v = Number(sats) / COIN;
  return v >= 1e6 ? (v/1e6).toFixed(2)+"M" : v >= 1e3 ? (v/1e3).toFixed(1)+"k" : v.toFixed(2);
};
const shortHash = h => h ? h.slice(0,12) + "…" + h.slice(-10) : "?";
const age = ts => {
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
};
const fmtTime = ts => new Date(ts * 1000).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "medium" });
const rewardAt = h => {
  const r = state.reward ?? 612073980;
  const hv = state.halving ?? 30143415;
  return Math.floor(r / Math.pow(2, Math.min(63, Math.floor(h / hv))));
};

async function api(path){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000); // 30 second timeout
  
  try {
    const r = await fetch(API + path, {
      headers: {"Accept": "application/json"},
      signal: controller.signal
    });
    clearTimeout(timeout);
    
    if (!r.ok) throw new Error("HTTP " + r.status + ": " + (r.statusText || "Unknown error"));
    return r.json();
  } catch (error) {
    clearTimeout(timeout);
    if (error.name === 'AbortError') {
      throw new Error("Request timeout - server took too long to respond");
    }
    throw error;
  }
}
function fail(e){
  $("#banner").style.display = "block";
  $("#banner").innerHTML = `<b>Connection Error:</b> ${e.message} ${API ? "" : "(served from the node itself — check your HTTPS domain)"}`;
}
function navActive(){
  const cur = location.hash.split("?")[0] || "#/";
  document.querySelectorAll("#nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.nav === cur.slice(2)));
}
function scheduleAuto(fn, ms){
  if (state.timer) clearTimeout(state.timer);
  state.timer = setTimeout(() => { state.timer = null; fn(); }, ms);
}
function showAllInputs(){
  document.querySelectorAll(".input-extra").forEach(x => x.style.display = "block");
  const btn = document.querySelector("#showInputs");
  if (btn) btn.style.display = "none";
}

/* ── Home ─────────────────────────────────────────────── */
async function loadHome(){
  const info = await api("/info/");
  state.tip = info.height;
  state.reward = info.block_reward_sats;
  state.halving = info.halving_interval;
  const [supply, list, mp] = await Promise.all([
    api("/supply/"),
    api("/blockchain/?start=" + Math.max(0, info.height - 9) + "&limit=10"),
    api("/mempool/")
  ]);
  const rows = (list.chain || []).slice().sort((a,b) => b.height - a.height);
  const latestTxs = (mp.txs || []).slice(0, 5);
  const supplyPct = Math.min(100, supply.circulating_sats / supply.max_supply_sats * 100);
  $("#sub").innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Block Height</div><div class="v">${info.height.toLocaleString()}</div><div class="s">Best: <span class="mono">${shortHash(info.best_hash)}</span></div></div>
      <div class="card"><div class="k">Network Difficulty</div><div class="v">${(+info.difficulty).toFixed(2)}</div><div class="s">Total work: ${fmtShortWork(info.total_work)}</div></div>
      <div class="card"><div class="k">Circulating Supply</div><div class="v">${fmtShortOri(supply.circulating_sats)}</div><div class="s">Max: ${fmtShortOri(supply.max_supply_sats)}</div><div class="bar"><i style="width:${supplyPct}%"></i></div></div>
      <div class="card"><div class="k">Block Reward</div><div class="v">${fmtOri(supply.current_block_reward_sats)}</div><div class="s">Halving in ${supply.blocks_until_halving.toLocaleString()} blocks</div></div>
      <div class="card"><div class="k">Mempool</div><div class="v">${info.mempool_txs.toLocaleString()}</div><div class="s">Pending transactions</div></div>
      <div class="card"><div class="k">Active Peers</div><div class="v">${info.peers}</div><div class="s">Connected nodes</div></div>
    </div>
    
    <h2>Latest Blocks</h2>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Height</th><th>Age</th><th>Time</th><th class="right">Txs</th><th class="right">Size</th><th class="right">Difficulty</th><th class="right">Miner Reward</th></tr>
      ${rows.map(b => `<tr>
        <td><b><a href="#/block/${b.height}">#${b.height}</a></b></td>
        <td class="muted">${age(b.timestamp)}</td>
        <td class="muted">${fmtTime(b.timestamp)}</td>
        <td class="right"><b>${b.tx_count}</b></td>
        <td class="right muted">${b.size} B</td>
        <td class="right">${(isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits)).toFixed(2)}</td>
        <td class="right mono tx-in">${fmtOri(rewardAt(b.height))}</td>
      </tr>`).join("")}
    </table>
    </div>
    <div class="pager"><span>Showing last 10 blocks</span><button onclick="location.hash='#/blocks'">View All Blocks &rarr;</button></div>
    
    <h2>Pending Transactions</h2>
    <div style="overflow-x:auto;">
    ${latestTxs.length ? `<table>
      <tr><th>Transaction ID (TxID)</th><th>Time</th><th class="right">Amount</th></tr>
      ${latestTxs.map(t => {
        const val = (t.outputs || []).reduce((a,o) => a + o.value, 0);
        return `<tr><td class="mono"><a href="#/tx/${t.txid}">${shortHash(t.txid)}</a></td><td class="muted">${t.timestamp ? fmtTime(t.timestamp) : "pending"}</td><td class="right mono tx-pending">${fmtOri(val)}</td></tr>`;
      }).join("")}
    </table>` : `<div style="background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px; text-align:center; color:var(--muted); font-weight:500;">No pending transactions in mempool. Network is caught up!</div>`}
    </div>`;
  scheduleAuto(loadHome, 5000);
}
function fmtShortWork(w){
  const n = Number(BigInt(w || 0));
  if (n >= 1e15) return (n/1e15).toFixed(1)+"P";
  if (n >= 1e12) return (n/1e12).toFixed(1)+"T";
  return n.toLocaleString();
}

/* ── Blocks (blockchain.com style) ───────────────────── */
async function loadBlocks(start){
  const parsed = Math.max(0, +start || 0);
  const info = await api("/info/");
  let s = parsed;
  if (!start && !location.hash.includes("start=")) s = Math.max(0, info.height - 24);
  s = Math.min(s, Math.max(0, info.height - 24));
  const d = await api("/blockchain/?start=" + s + "&limit=25");
  const rows = (d.chain || []).slice().sort((a,b) => b.height - a.height);
  const newest = s + 25 >= d.tip;
  $("#sub").innerHTML = `
    <h2>Blockchain Explorer <span class="badge badge-green" style="margin-left:8px">${d.tip.toLocaleString()} total blocks</span></h2>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Height</th><th>Age</th><th>Time</th><th class="right">Transactions</th><th class="right">Size</th><th class="right">Difficulty</th><th class="right">Miner Reward</th></tr>
      ${rows.map(b => `<tr>
        <td><b><a href="#/block/${b.height}">#${b.height}</a></b></td>
        <td class="muted">${age(b.timestamp)}</td>
        <td class="muted">${fmtTime(b.timestamp)}</td>
        <td class="right"><b><a href="#/block/${b.height}">${b.tx_count}</a></b></td>
        <td class="right muted">${b.size} B</td>
        <td class="right">${(isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits)).toFixed(2)}</td>
        <td class="right mono tx-in">${fmtOri(rewardAt(b.height))}</td>
      </tr>`).join("")}
    </table>
    </div>
    <div class="pager">
      <button ${newest ? "disabled" : ""} onclick="location.hash='#/blocks?start=${s+25}'">&larr; Newer Blocks</button>
      <span>Showing blocks ${s} &ndash; ${Math.min(d.tip, s + 24)}</span>
      <button ${s === 0 ? "disabled" : ""} onclick="location.hash='#/blocks?start=${Math.max(0, s-25)}'">Older Blocks &rarr;</button>
    </div>`;
}

/* ── Block detail ────────────────────────────────────── */
async function loadBlock(height){
  const [b, txsData] = await Promise.all([
    api("/block/" + height),
    api("/block/" + height + "/txs")
  ]);
  const diff = isFinite(b.difficulty) ? b.difficulty : diffFromBits(b.bits);
  const txs = txsData.txs || [];
  $("#sub").innerHTML = `
    <h2>Block #${b.height}</h2>
    <div class="detail">
      <div class="row"><div class="k">Height</div><div class="v"><b>${b.height}</b></div></div>
      <div class="row"><div class="k">Hash</div><div class="v mono">${b.hash}</div></div>
      <div class="row"><div class="k">Previous Hash</div><div class="v mono">${b.height > 0 ? `<a href="#/block/${b.height-1}">${b.prev_hash}</a>` : b.prev_hash}</div></div>
      <div class="row"><div class="k">Merkle Root</div><div class="v mono">${b.merkle_root}</div></div>
      <div class="row"><div class="k">Timestamp</div><div class="v">${fmtTime(b.timestamp)} UTC <span class="muted">(${age(b.timestamp)})</span></div></div>
      <div class="row"><div class="k">Difficulty</div><div class="v">${isFinite(diff) ? diff.toFixed(2) : "n/a"}</div></div>
      <div class="row"><div class="k">Bits / Nonce</div><div class="v mono">0x${b.bits.toString(16)} / ${b.nonce}</div></div>
      <div class="row"><div class="k">Version</div><div class="v">0x${b.version.toString(16)}</div></div>
      <div class="row"><div class="k">Size</div><div class="v">${b.size.toLocaleString()} bytes</div></div>
      <div class="row"><div class="k">Miner Reward</div><div class="v mono tx-in">${(() => {
        const cbVal = (txs[0] && txs[0].coinbase) ? txs[0].output_value : null;
        const subsidy = rewardAt(b.height);
        const fees = cbVal != null ? Math.max(0, cbVal - subsidy) : 0;
        if (cbVal == null) return fmtOri(subsidy);
        return `<b>${fmtOri(cbVal)}</b> <span class="muted">(Subsidy: ${fmtOri(subsidy)}${fees > 0 ? ` + Fees: ${fmtOri(fees)}` : ""})</span>`;
      })()}</div></div>
      <div class="row"><div class="k">Transactions</div><div class="v"><b>${b.tx_count}</b></div></div>
    </div>
    
    <h2>Transactions in Block</h2>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Transaction ID (TxID)</th><th class="right">Output Value</th></tr>
      ${txs.map((t, i) => `<tr><td class="mono"><a href="#/tx/${t.txid}">${i === 0 ? "<b>&#9671; Coinbase Reward</b>" : shortHash(t.txid)}</a></td><td class="right mono ${i === 0 ? "tx-in" : ""}">${fmtOri(t.output_value)}</td></tr>`).join("")}
    </table>
    </div>`;
}

/* ── Transaction detail ──────────────────────────────── */
async function loadTx(txid){
  const d = await api("/tx/" + txid);
  const ins = d.inputs || [], outs = d.outputs || [];
  const confirmed = !d.mempool;
  const isCoinbase = d.block && d.block.height != null &&
                     (ins.length === 0 || (ins[0] && ins[0].coinbase));
  const inValue = ins.reduce((a,i) => a + (+(i.value || 0)), 0);
  const outValue = outs.reduce((a,o) => a + (+(o.value || 0)), 0);
  const fee = d.fee_sats != null ? d.fee_sats : Math.max(0, inValue - outValue);
  const conf = d.confirmations ?? (confirmed ? 1 : 0);
  let rewardRows = "";
  if (isCoinbase && confirmed && d.block.height != null) {
    const subsidy = rewardAt(d.block.height);
    const cbFees = Math.max(0, outValue - subsidy);
    rewardRows = `
      <div class="row"><div class="k">Type</div><div class="v"><span class="badge badge-green">&#9671; Coinbase Reward</span> <span class="muted" style="margin-left:8px">New coins generated by mining</span></div></div>
      <div class="row"><div class="k">Block Subsidy</div><div class="v mono">${fmtOri(subsidy)}</div></div>
      ${cbFees > 0 ? `<div class="row"><div class="k">Tx Fees Collected</div><div class="v mono tx-in">+ ${fmtOri(cbFees)} <span class="muted">(From transactions in this block)</span></div></div>` : ""}
      <div class="row"><div class="k">Total Miner Reward</div><div class="v mono tx-in"><b>${fmtOri(outValue)}</b></div></div>`;
  }
  $("#sub").innerHTML = `
    <h2>Transaction Details</h2>
    <div class="detail">
      <div class="row"><div class="k">TxID</div><div class="v mono"><b>${d.txid}</b></div></div>
      <div class="row"><div class="k">Status</div><div class="v">${confirmed ? '<span class="badge badge-green">Confirmed</span>' : '<span class="badge badge-pending">Pending (Mempool)</span>'} <span class="muted" style="margin-left:8px; font-weight:600">${conf} confirmation${conf === 1 ? "" : "s"}</span></div></div>
      <div class="row"><div class="k">Block</div><div class="v">${confirmed && d.block && d.block.height != null ? `<b><a href="#/block/${d.block.height}">#${d.block.height}</a></b> <span class="muted mono">(${shortHash(d.block.hash)})</span>` : "Not mined yet"}</div></div>
      <div class="row"><div class="k">Timestamp</div><div class="v">${d.timestamp ? fmtTime(d.timestamp) : "&ndash;"}</div></div>
      <div class="row"><div class="k">Size</div><div class="v">${d.size.toLocaleString()} bytes</div></div>
      ${isCoinbase ? "" : `<div class="row"><div class="k">Fee</div><div class="v mono">${fee ? fmtOri(fee) : "&ndash;"}${d.fee_rate_sats ? ` <span class="muted">(${d.fee_rate_sats} sats/vB)</span>` : ""}</div></div>`}
      ${rewardRows}
      <div class="row"><div class="k">Version / Locktime</div><div class="v mono">v${d.version} / ${d.locktime}</div></div>
      ${d.message ? `<div class="row"><div class="k">Message</div><div class="v"><div class="message-box">${esc(d.message)}</div></div></div>` : ""}
      
      <div class="row"><div class="k">Inputs (${ins.length})</div><div class="v">
        ${(ins.length === 0 || (ins[0] && ins[0].coinbase)) ? '<div style="padding:4px 0"><span class="badge badge-green">&#9671; Coinbase</span> <span class="muted" style="margin-left:8px">&mdash; New coins generated in this block</span></div>'
          : ins.map((i, idx) => `
          <div class="${idx >= 5 ? "input-extra" : ""}" style="padding:6px 0; border-bottom:1px dashed var(--border); ${idx >= 5 ? "display:none" : ""}">
            <span class="mono"><a href="#/tx/${i.prev_txid}">${shortHash(i.prev_txid)}</a>:${i.prev_vout}</span> 
            <span class="mono tx-out" style="float:right">${i.value != null ? "- " + fmtOri(i.value) : ""}</span>
          </div>`).join("")}
        ${!isCoinbase && ins.length > 5 ? `<button id="showInputs" class="more-btn" onclick="showAllInputs()">Show ${ins.length - 5} more inputs</button>` : ""}
      </div></div>
      
      <div class="row"><div class="k">Outputs (${outs.length})</div><div class="v">
        ${outs.map((o, i) => `<div style="padding:6px 0; border-bottom:1px dashed var(--border);">
            <span class="mono">${o.address ? '<a href="#/address/' + o.address + '">' + esc(o.address) + '</a>' : esc(o.script_pubkey)}</span> 
            <span class="right mono tx-in" style="float:right">+ ${fmtOri(o.value)}</span>
          </div>`).join("")}
      </div></div>
    </div>
    
    <h2>Raw Hex Data</h2>
    <div class="raw">${esc(d.raw_hex || d.hex || "")}</div>`;
}

/* ── Address ─────────────────────────────────────────── */
async function loadAddress(addr, utxoPage){
  try {
    console.log("Loading address:", addr, "page:", utxoPage);
    const page = Math.max(1, parseInt(utxoPage) || 1);
    
    const d = await api("/address/" + addr + "?utxo_page=" + page + "&utxo_limit=10");
    const u = d.utxos || [];
    const mature = u.filter(x => x.mature);
    const immature = u.filter(x => !x.mature);
    const bal = mature.reduce((a,x) => a + x.value, 0);
    const imm = immature.reduce((a,x) => a + x.value, 0);
    const history = d.history || [];
    const txids = [...new Set(history.map(x => x.txid).filter(Boolean))];
    const pagination = d.utxo_pagination || {};
    
    console.log("Rendering address page with", u.length, "UTXOs, balance:", d.balance_sats);
    
    $("#sub").innerHTML = `
      <h2>Wallet Address</h2>
      <div class="detail">
        <div class="row"><div class="k">Address</div><div class="v mono" style="font-size:15px"><b>${esc(addr)}</b></div></div>
        <div class="row"><div class="k">Available Balance</div><div class="v mono tx-in" style="font-size:20px"><b>${fmtOri(d.balance_sats || bal)}</b></div></div>
        <div class="row"><div class="k">Total Received</div><div class="v mono tx-in">${fmtOri(d.total_received_sats || 0)}</div></div>
        <div class="row"><div class="k">Total Spent</div><div class="v mono tx-out">${fmtOri(d.total_spent_sats || 0)}</div></div>
        <div class="row"><div class="k">Total Volume</div><div class="v mono">${fmtOri(d.total_volume_sats || 0)}</div></div>
        <div class="row"><div class="k">Immature Mining</div><div class="v mono">${fmtOri(d.immature_sats || imm)}</div></div>
        <div class="row"><div class="k">Stats</div><div class="v"><span class="badge badge-green">${pagination.total_items || u.length} UTXOs</span> <span class="badge badge-no" style="margin-left:8px">${txids.length} Transactions</span></div></div>
      </div>
      
      <h2>Transaction History</h2>
      <div style="overflow-x:auto;">
      ${history.length ? `<table>
        <tr><th>Transaction ID</th><th>Time</th><th>Status</th><th class="right">Amount</th></tr>
        ${history.slice(0, 50).map(x => `<tr>
          <td class="mono"><a href="#/tx/${x.txid}">${shortHash(x.txid)}</a></td>
          <td class="muted">${x.timestamp ? fmtTime(x.timestamp) : "pending"}</td>
          <td>${x.mempool ? '<span class="badge badge-pending">Pending</span>' : x.net_sats >= 0 ? '<span class="badge badge-green">Received</span>' : '<span class="badge badge-red">Sent</span>'}</td>
          <td class="right mono ${x.mempool ? "tx-pending" : x.net_sats >= 0 ? "tx-in" : "tx-out"}"><b>${x.net_sats >= 0 ? "+" : ""}${fmtOri(x.net_sats)}</b></td>
        </tr>`).join("")}
        ${history.length > 50 ? `<tr><td colspan="4" style="text-align:center;padding:10px;color:var(--muted);">Showing latest 50 transactions of ${history.length} total</td></tr>` : ''}
      </table>` : '<div style="background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px; text-align:center; color:var(--muted); font-weight:500;">No transactions found for this address.</div>'}
      </div>
      
      <h2>Unspent Outputs (UTXOs) ${pagination.total_items ? `<span class="badge badge-green" style="margin-left:8px">${pagination.total_items} total</span>` : ''}</h2>
      <div style="overflow-x:auto;">
      ${u.length ? `<table>
        <tr><th>TxID</th><th class="right">Vout</th><th class="right">Value</th><th>Status</th></tr>
        ${u.map(x => `<tr>
          <td class="mono"><a href="#/tx/${x.txid}">${shortHash(x.txid)}</a></td>
          <td class="right mono">${x.vout}</td>
          <td class="right mono tx-in">${fmtOri(x.value)}</td>
          <td>${x.mature ? '<span class="badge badge-green">Spendable</span>' : '<span class="badge badge-pending">Immature</span>'}</td>
        </tr>`).join("")}
      </table>` : '<p class="muted">No UTXOs.</p>'}
      </div>
      
      ${pagination.total_pages > 1 ? `<div class="pager">
        <button ${!pagination.has_prev ? "disabled" : ""} onclick="location.hash='#/address/${addr}?utxo_page=${pagination.current_page - 1}'">&larr; Previous</button>
        <span>Page ${pagination.current_page} of ${pagination.total_pages} (${pagination.start_index}-${pagination.end_index} of ${pagination.total_items} UTXOs)</span>
        <button ${!pagination.has_next ? "disabled" : ""} onclick="location.hash='#/address/${addr}?utxo_page=${pagination.current_page + 1}'">Next &rarr;</button>
      </div>` : ''}`;
      
    console.log("Address page rendered successfully");
  } catch (error) {
    console.error("Error loading address:", error);
    $("#sub").innerHTML = `
      <div style="text-align:center; padding:60px 0;">
        <h2 style="color:var(--red)">Error Loading Address</h2>
        <p class="muted">Failed to load address data: ${error.message}</p>
        <p class="muted">Address: ${esc(addr)}</p>
        <button onclick="location.reload()" class="more-btn">Refresh Page</button>
      </div>`;
  }
}

/* ── Mempool ─────────────────────────────────────────── */
async function loadMempool(){
  const [info, mp] = await Promise.all([api("/info/"), api("/mempool/")]);
  const txs = mp.txs || [];
  const totalBytes = txs.reduce((a,t) => a + t.size, 0);
  const totalFee = txs.reduce((a,t) => a + t.fee, 0);
  const avgRate = totalBytes ? (totalFee / totalBytes) : 0;
  $("#sub").innerHTML = `
    <h2>Mempool <span class="muted" style="text-transform:none;font-weight:400; margin-left:12px; font-size:14px">Transactions waiting to be confirmed</span></h2>
    <div class="chips">
      <span class="chip">Transactions <b>${mp.count}</b></span>
      <span class="chip">Total Size <b>${(totalBytes/1024).toFixed(1)} KB</b></span>
      <span class="chip">Total Fees <b class="tx-in">${fmtOri(totalFee)}</b></span>
      <span class="chip">Avg Fee Rate <b>${avgRate.toFixed(2)} sats/vB</b></span>
      <span class="chip">Next Block <b>~${info.block_time_seconds}s</b></span>
    </div>
    
    <div style="overflow-x:auto;">
    ${txs.length === 0 ? '<div style="background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:40px; text-align:center; color:var(--muted); font-weight:500;">Mempool is completely empty! Zero pending transactions.</div>' : `
    <table>
      <tr><th>Transaction Hash</th><th class="right">Value</th><th class="right">Fee</th><th class="right">Fee Rate</th><th class="right">Size</th><th>RBF</th></tr>
      ${txs.map(t => {
        const val = (t.outputs || []).reduce((a,o) => a + o.value, 0);
        return `<tr>
          <td class="mono"><a href="#/tx/${t.txid}">${shortHash(t.txid)}</a></td>
          <td class="right mono">${fmtOri(val)}</td>
          <td class="right mono tx-in">${fmtOri(t.fee)}</td>
          <td class="right mono">${t.fee_rate.toFixed(2)} <span class="muted">sats/vB</span></td>
          <td class="right muted">${t.size.toLocaleString()} B</td>
          <td>${t.rbf ? '<span class="badge badge-yes">RBF Enabled</span>' : '<span class="badge badge-no">No</span>'}</td>
        </tr>`;
      }).join("")}
    </table>`}
    </div>`;
  scheduleAuto(loadMempool, 5000);
}

/* ── Router ──────────────────────────────────────────── */
async function router(){
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  navActive();
  const [route, qs] = (location.hash || "#/").slice(1).split("?");
  const params = new URLSearchParams(qs || "");
  
  // Show loading indicator
  $("#sub").innerHTML = '<div style="text-align:center; padding:60px 0;"><h2>Loading...</h2></div>';
  
  try {
    console.log("Routing to:", route, "params:", params.toString());
    
    if (route === "" || route === "/") return loadHome();
    const parts = route.split("/").filter(Boolean);
    if (parts[0] === "blocks") return loadBlocks(params.get("start"));
    if (parts[0] === "block") return loadBlock(parts[1]);
    if (parts[0] === "tx") return loadTx(parts[1]);
    if (parts[0] === "address") {
      console.log("Loading address:", parts[1], "with params:", params.toString());
      return loadAddress(parts[1], params.get("utxo_page"));
    }
    if (parts[0] === "mempool") return loadMempool();
    
    $("#sub").innerHTML = "<div style='text-align:center; padding:60px 0;'><h2>404 Not Found</h2><p class='muted'>The page you are looking for does not exist on this explorer.</p></div>";
  } catch (e) {
    console.error("Router error:", e);
    fail(e);
  }
}

async function doSearch(){
  const q = $("#q").value.trim();
  if (!q) return;
  const params = new URLSearchParams(location.search);
  const base = API || "";
  try {
    const info = await api("/info/");
    if (/^[0-9]+$/.test(q) && +q >= 0 && +q <= info.height) return location.hash = "#/block/" + q;
    if (/^(ori1[a-z0-9]{20,})$/.test(q)) return location.hash = "#/address/" + q;
    if (/^[0-9a-f]{64}$/i.test(q)) {
      try {
        const r = await fetch(base + "/tx/" + q, {headers:{"Accept":"application/json"}});
        if (r.ok) return location.hash = "#/tx/" + q;
      } catch (e) {}
      try {
        const r = await fetch(base + "/block/hash/" + q, {headers:{"Accept":"application/json"}});
        const b = await r.json();
        if (r.ok && b.height != null) return location.hash = "#/block/" + b.height;
      } catch (e2) {}
    }
    $("#banner").style.display = "block";
    $("#banner").innerHTML = `<b>Search Error:</b> No match found for <i>${esc(q)}</i>`;
    setTimeout(() => $("#banner").style.display = "none", 4000);
  } catch (e) {
    fail(e);
  }
}

$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
addEventListener("hashchange", router);
router();
</script>
</body>
